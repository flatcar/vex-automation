version: 2

project_name: flatcar-vex

before:
  hooks:
    - go mod tidy

builds:
  - id: flatcar-vex
    main: ./cmd/flatcar-vex
    binary: flatcar-vex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/flatcar/vex-automation/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# release-please (.github/workflows/release-please.yml) creates the GitHub
# Release and its notes/changelog when it tags a version; this workflow only
# runs afterwards (triggered by that tag push, see
# .github/workflows/release.yml) to attach build artifacts to the release
# release-please already created. "keep-existing" (goreleaser's default)
# leaves those release notes untouched, and disabling goreleaser's own
# changelog generation avoids maintaining the same logic in two places.
release:
  mode: keep-existing

changelog:
  disable: true
