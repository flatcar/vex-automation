version: 2

project_name: flatcar-vex

before:
  hooks:
    - go mod tidy

builds:
  - id: flatcar-vex
    main: ./cmd/flatcar-vex
    binary: flatcar-vex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/flatcar/vex-automation/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: flatcar-vex
    package_name: flatcar-vex
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, archlinux]
    vendor: Flatcar
    homepage: https://github.com/flatcar/vex-automation
    maintainer: Flatcar Maintainers <maintainers@flatcar-linux.org>
    description: Generates OpenVEX documents and CVE release-note diffs for Flatcar releases.
    license: Apache-2.0
    bindir: /usr/bin
    # sync-glsa uses go-git; the git binary is only needed when --repo is a
    # local path.
    recommends:
      - git
    archlinux:
      packager: Flatcar Maintainers <maintainers@flatcar-linux.org>
    contents:
      - src: README.md
        dst: /usr/share/doc/flatcar-vex/README.md
      - src: LICENSE
        dst: /usr/share/doc/flatcar-vex/LICENSE

checksum:
  name_template: "checksums.txt"

# release-please (.github/workflows/release-please.yml) creates the GitHub
# Release and its notes/changelog when it tags a version; goreleaser then
# runs as a later step of that same workflow run to attach build artifacts
# to that release. The tag must be plain semver (vX.Y.Z, see
# include-component-in-tag in release-please-config.json).
# .github/workflows/release.yml is only a fallback for manually pushed tags.
# "keep-existing" (goreleaser's default) leaves the release notes untouched,
# and disabling goreleaser's own changelog generation avoids maintaining the
# same logic in two places.
release:
  mode: keep-existing

changelog:
  disable: true
