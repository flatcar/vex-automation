name: pr-title-lint

# Enforces Conventional Commits (https://www.conventionalcommits.org/) on the
# PR title. This matters because this repository merges PRs via
# "squash and merge" (see release-please note in
# .github/workflows/release-please.yml): the PR title becomes the single
# commit message release-please parses to decide the next version bump, so
# an unconventional title means release-please silently treats the change
# as a non-release-worthy commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
