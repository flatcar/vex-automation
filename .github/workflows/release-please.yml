name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Parses Conventional Commits since the last release, maintains a
      # running "Release PR" with the computed version bump and generated
      # CHANGELOG.md entry, and (once that PR is merged) tags the release
      # and publishes the GitHub Release with notes.
      #
      # Uses the default secrets.GITHUB_TOKEN. Normally a tag/PR created
      # with GITHUB_TOKEN would not trigger further workflow runs (GitHub
      # deliberately suppresses that to prevent recursive workflow loops).
      # We avoid needing a separate token/secret for that by NOT relying on
      # a second, tag-triggered workflow: the goreleaser build below runs
      # as a later step in this SAME workflow run, gated on
      # steps.release.outputs.release_created, so no second trigger is
      # needed at all. See googleapis/release-please-action's documented
      # "combined workflow" pattern.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-merge the Release PR, the same way flatcar/scripts lets its bot
      # through: the merge is made as the flatcar-infra user with its PAT
      # (BOT_PR_TOKEN repo secret), and flatcar-infra is an `always` bypass
      # actor on the default-branch-protection ruleset (configured in
      # flatcar/safe-settings-admin .github/repos/vex-automation.yml).
      #
      # GITHUB_TOKEN cannot be used here: the GitHub Actions app can't be
      # given a working ruleset bypass, and a merge made with GITHUB_TOKEN
      # would not trigger this workflow again, so the release would never be
      # cut. A PAT merge does trigger it: the next run of this workflow sees
      # the merged Release PR, tags the release and runs goreleaser below.
      #
      # release-please itself deliberately keeps using GITHUB_TOKEN: a tag
      # it pushes with a PAT would also trigger release.yml and build the
      # release twice.
      #
      # Without BOT_PR_TOKEN this step only warns, and a maintainer merges
      # the Release PR by hand as before.
      - name: Merge the Release PR
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--main--components--flatcar-vex
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::BOT_PR_TOKEN is not set; merge the Release PR manually."
            exit 0
          fi
          pr=$(gh pr list --head "${RELEASE_BRANCH}" --state open \
            --label 'autorelease: pending' --json number --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            echo "No open Release PR."
            exit 0
          fi
          # GitHub may still be computing mergeability of a just-updated PR.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${pr}" --squash --admin; then
              exit 0
            fi
            echo "Merge attempt ${attempt} failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      # Everything below only runs when release-please just created a new
      # release (i.e. a release PR was merged on this push), building and
      # attaching binaries to the release it created. Tags are plain
      # vX.Y.Z (include-component-in-tag: false in
      # release-please-config.json) because goreleaser requires a semver
      # tag and cannot parse "flatcar-vex-vX.Y.Z".
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser
        if: ${{ steps.release.outputs.release_created }}
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
